version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        - env | grep -E '^(FACEJOB_|NEXT_PUBLIC_|NODE_)' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
